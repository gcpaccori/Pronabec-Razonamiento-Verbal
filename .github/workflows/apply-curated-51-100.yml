name: Apply curated learning 51-100

on:
  push:
    branches:
      - curated-51-100
    paths:
      - .github/workflows/apply-curated-51-100.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curated-51-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply app integration
        run: python scripts/apply_curated_patch.py
      - name: JavaScript syntax QA
        run: |
          node --check app.js
          node --check data/learning-coach.js
          node --check data/curated-coach-51-100.js
          node --check data/learning-ui.js
          node --check data/session-engine.js
          node --check data/learning-bank-51-60.js
          node --check data/learning-bank-61-70.js
          node --check data/learning-bank-71-80.js
          node --check data/learning-bank-81-90.js
          node --check data/learning-bank-91-100.js
      - name: Verify curated bank completeness
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {}, console };
          vm.createContext(sandbox);
          const files = [
            'data/questions.js',
            'data/learning-bank-51-60.js',
            'data/learning-bank-61-70.js',
            'data/learning-bank-71-80.js',
            'data/learning-bank-81-90.js',
            'data/learning-bank-91-100.js'
          ];
          files.forEach(f => vm.runInContext(fs.readFileSync(f, 'utf8'), sandbox, { filename: f }));
          const flat = (sandbox.window.PRONABEC_DATA.topics || []).flatMap(t => t.questions || []);
          const bank = sandbox.window.PRONABEC_CURATED_51_100 || {};
          const expected = flat.slice(50, 100).map(q => q.id);
          const ids = Object.keys(bank).sort((a, b) => bank[a].position - bank[b].position);
          if (ids.length !== 50) throw new Error('Expected 50 curated entries, got ' + ids.length);
          if (JSON.stringify(ids) !== JSON.stringify(expected)) throw new Error('Curated IDs do not match global exercises 51-100');
          for (const id of ids) {
            const q = flat.find(x => x.id === id);
            const e = bank[id];
            const letters = (q.alternatives || []).map(a => a.letter);
            if (!letters.includes(e.answer)) throw new Error('Invalid answer for ' + id);
            for (const letter of letters) {
              if (letter !== e.answer && !e.wrong?.[letter]) throw new Error('Missing distractor explanation: ' + id + ' ' + letter);
            }
            if (!e.focus || !e.point || !e.transfer || !e.anchor) throw new Error('Incomplete pedagogy: ' + id);
          }
          console.log('Curated bank QA passed: 50/50 exercises, every distractor covered.');
          NODE
          grep -q "annotatePrompt" app.js
          grep -q "successFeedback" app.js
      - name: Remove temporary curation files
        run: |
          rm -f tmp/questions-51-100.json
          rm -f tmp/curation-51-100.md
          rm -f .github/workflows/export-questions-51-100.yml
          rm -f .github/workflows/apply-curated-51-100.yml
          rm -f scripts/apply_curated_patch.py
      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add curated learning guidance for exercises 51-100"
          git push origin HEAD:curated-51-100
