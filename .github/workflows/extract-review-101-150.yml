name: Extract review 101-150
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-review-101-150.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build review excerpt
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {}, console };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/questions.js','utf8'), sandbox);
          const topics = sandbox.window.PRONABEC_DATA.topics || [];
          const flat = [];
          for (const t of topics) {
            const ctx = new Map((t.contexts || []).map(c => [c.id, c]));
            for (const q of (t.questions || [])) {
              const c = ctx.get(q.context_id);
              flat.push({
                position: flat.length + 1,
                id: q.id,
                topic_id: t.id,
                topic: t.title,
                prompt: q.prompt,
                prelude_text: q.prelude_text || '',
                context_id: q.context_id || null,
                context_label: c?.label || '',
                context_text: c?.text || '',
                alternatives: q.alternatives,
                correct_answer: q.correct_answer,
                correct_answer_text: q.correct_answer_text,
                original_page_start: q.original_page_start,
                answer_source_page: q.answer_source_page
              });
            }
          }
          const out = flat.slice(100,150);
          if (out.length !== 50) throw new Error('Expected 50 questions');
          fs.writeFileSync('data/review-101-150.json', JSON.stringify(out, null, 2));

          const lines = out.map(q => [
            q.position, q.id, q.topic,
            String(q.prompt).replace(/\s+/g,' ').trim(),
            (q.alternatives||[]).map(a => `${a.letter}) ${String(a.text).replace(/\s+/g,' ').trim()}`).join(' || '),
            `KEY=${q.correct_answer}`,
            `PAGE=${q.original_page_start}`,
            `ANS_PAGE=${q.answer_source_page}`
          ].join('\t'));
          fs.writeFileSync('data/review-index-101-150.txt', lines.join('\n'));

          const contexts = [];
          const seen = new Set();
          for (const q of out) {
            if (!q.context_id || seen.has(q.context_id)) continue;
            seen.add(q.context_id);
            contexts.push({
              topic: q.topic,
              context_id: q.context_id,
              label: q.context_label,
              text: q.context_text,
              question_positions: out.filter(x => x.context_id === q.context_id).map(x => x.position)
            });
          }
          fs.writeFileSync('data/review-contexts-101-150.json', JSON.stringify(contexts, null, 2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review-101-150.json data/review-index-101-150.txt data/review-contexts-101-150.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh temporary review extract 101-150"
          git push
