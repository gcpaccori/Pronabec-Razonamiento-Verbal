name: Apply inline guided reading

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-guided-reading.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guided reading patch
        run: python tools/apply_inline_learning.py

      - name: Validate
        run: |
          node --check app.js
          node --check data/learning-coach.js

      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move learning feedback into guided source text'
          git push origin HEAD:main
