name: Export questions 51-100

on:
  push:
    branches: [curated-51-100]
    paths:
      - '.github/workflows/export-questions-51-100.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curated-51-100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export exact global questions 51-100
        run: |
          python - <<'PY'
          import json, pathlib
          src = json.loads(pathlib.Path('data/questions.json').read_text(encoding='utf-8'))
          flat=[]
          for topic in src.get('topics',[]):
              contexts={str(c.get('id')):c for c in topic.get('contexts',[])}
              for q in topic.get('questions',[]):
                  flat.append((topic, contexts.get(str(q.get('context_id'))), q))
          selected=flat[50:100]
          assert len(selected)==50
          lines=['# Exact source for global exercises 51–100','']
          last_topic=None
          seen_context=set()
          for pos,(topic,context,q) in enumerate(selected,start=51):
              topic_key=(topic.get('topic_number'),topic.get('title'))
              if topic_key!=last_topic:
                  lines += [f"## Tema {topic.get('topic_number')}: {topic.get('title')}",'']
                  last_topic=topic_key
              if context:
                  ck=(topic.get('id'),context.get('id'))
                  if ck not in seen_context:
                      seen_context.add(ck)
                      lines += [f"### {context.get('label','Texto')}", '', (context.get('text') or '').strip(), '']
              pre=(q.get('prelude_text') or '').strip()
              lines += [f"### Ejercicio {pos} · {q.get('id')}"]
              if pre: lines += [f"Preámbulo: {pre}"]
              lines += [f"Pregunta: {(q.get('prompt') or '').strip()}"]
              for a in q.get('alternatives',[]):
                  lines += [f"{a.get('letter')}) {(a.get('text') or '').strip()}"]
              lines += [f"CORRECTA: {q.get('correct_answer')}) {(q.get('correct_answer_text') or '').strip()}",'']
          pathlib.Path('tmp').mkdir(exist_ok=True)
          pathlib.Path('tmp/curation-51-100.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/curation-51-100.md
          git diff --cached --quiet && exit 0
          git commit -m 'Export compact source for exercises 51-100'
          git push origin HEAD:curated-51-100
